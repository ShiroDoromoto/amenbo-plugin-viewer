# マージ前のゲート。
#
# **task ブランチは PR で載る。** `push` は `main` に絞ってあり、広げない——push のとき path フィルタが
# 見るのは「その push の差分」だけなので、何度かに分けて押したブランチは各回を単独で判定してしまう。
# `pull_request` なら merge base との差分＝ブランチの差分全体を見る。
#
# **絞るのはトリガではなくジョブ。** トリガに `paths` を置くと、当たらない変更ではワークフローごと走らず、
# 必須チェックが報告されないまま PR が永久に待つ。層の判定は `changes` ジョブがやり、各ジョブは自分の層で
# 立つ・立たなければ skip される。
name: ci

# **手で回せる口が1つ要る。** 出す日はこちらで決められないので、「今日の runner で、いまの main が
# まだ組めるか」を訊きたい場面が来る（→ リリースの手順）。main の各コミットは push のときに一度
# 通っているが、それは**その日の**答えでしかない——runner の像も、ネットワーク越しに引く依存も動く。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 畳んでよいのは PR だけ。PR の run はブランチの差分全体を見るので、新しい run は古い run を包含している。
#
# main はそうならない——push の run が見るのはその push の差分だけなので、畳むと「畳まれた側の変更を
# 誰も検証しないまま main が緑を名乗る」。だから main は SHA でグループを分け、どの run も畳まれない。
#
# **手で回した run は run_id で分ける。** SHA で分けると、同じコミットに対する push の run と
# 同じ組に入り、**訊いた側が答えた側を打ち切る**（`cancel-in-progress`）。訊きたいのは
# 「もう一度組めるか」なので、前の答えを消してしまっては訊いた意味が無い。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'workflow_dispatch' && github.run_id || github.sha }}
  cancel-in-progress: true

jobs:
  # どの層が動いたか。ここだけが差分を読み、以降のジョブはこの答えしか見ない。
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    # PR では dorny/paths-filter が GitHub API で変更ファイルを引くので pull-requests:read が要る。
    # 既定のトークンには無く、無いと PR のたびにここが落ちて、下のジョブは全部 skip になる。
    # push は git で差分を取るので追加の権限は要らない。
    permissions:
      contents: read
      pull-requests: read
    #
    # **手で回したときは3層とも立てる。** そこには比べる差分が無い（PR でも push でもないので
    # 基準になるコミットが無い）ので、差分を訊けば「何も動いていない」が返り、下のジョブは全部
    # skip される——`all green` は skip を通すので、**何も検証しないまま緑を名乗る run** ができる。
    # 訊いているのは「いまの main が丸ごと組めるか」なので、全部立てるのが答えになる。
    outputs:
      app: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true' }}
      plugin: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.plugin == 'true' }}
      worker: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.worker == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # 層の定義は .github/paths-filters.yml が持ち主。ジョブの並びと別々に書くと離れる。
          filters: .github/paths-filters.yml

  # ツールチェーンの版は .tool-versions が唯一の持ち主。手元は mise がそこから入れるので、CI が同じ
  # ファイルを読むかぎり2つは離れない。**ここに数字を書かない**——片方だけ上げたとき、落ちた理由が
  # 自分の変更なのか版の更新なのか読めなくなる。
  #
  # setup-node / flutter-action のファイル読み取り機能には渡せない。setup-node の
  # `node-version-file` は `nodejs <版>` の行しか読まず、先に当たったコメント行を版と読んでしまう。
  # 引けなければ落とす：無言で既定の版に落ちると、手元と CI が黙って離れる。
  versions:
    name: read the declared tool versions
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.read.outputs.node }}
      flutter: ${{ steps.read.outputs.flutter }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          for tool in node flutter; do
            version=$(awk -v t="$tool" '$1 == t { print $2 }' .tool-versions)
            test -n "$version" || { echo ".tool-versions declares no $tool version"; exit 1; }
            echo "$tool=$version" >> "$GITHUB_OUTPUT"
          done

  # 静的解析とテスト。プラットフォームの SDK が要らないので、いちばん安い runner で回る。
  app-check:
    name: app — analyze and test
    runs-on: ubuntu-latest
    needs: [changes, versions]
    if: ${{ needs.changes.outputs.app == 'true' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.versions.outputs.flutter }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  # 2つの OS 向けに実際に組めること。ここが通らないビルドは、テストが全部緑でも出せない。
  #
  # **識別子は3つある**（`local` / `dev` / `store`）。Android は3つとも組む。差が
  # 識別子と表示名だけなので2本目からは増分で終わり、**flavor を1つしか組まないと、残り2つが壊れても
  # ここは緑を名乗る**。iOS は1本が数分かかるので、組むのは出す側（`store`）だけにし、
  # 3つの識別子が揃っていることは `app-check` の `flutter test` が見る（`test/flavors_test.dart`）。
  #
  # **ここは配る場所でもある。** `dev` の APK は焼いたものをそのまま artifact に載せ、メンバーは
  # `gh run download` で取る。Android のために置き場を別に立てないので、配るために増える段は
  # 鍵を置くのと upload の2つだけで済む（→ `app/README.md`）。
  #
  # **`dev` の署名鍵は1本に固定してある。** 鍵が run ごとに変わると、メンバーは新しい APK のたびに
  # 前のものを消すことになり、**ペアリングまで消える**（実測してある）。鍵は secret にだけ在り、
  # リポジトリにも手元にも置かない——公開すれば、誰でも「Amenbo Dev」を名乗る APK に署名でき、
  # それは端末から見て正規の更新なので、**その端末の写しとペアリングの鍵を引き継いでしまう**。
  app-android:
    name: app — build the APK
    runs-on: ubuntu-latest
    needs: [changes, versions]
    if: ${{ needs.changes.outputs.app == 'true' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.versions.outputs.flutter }}
          channel: stable
          cache: true
      - run: flutter pub get
      # 鍵は secret から書き出す。gradle は触らない——`key.properties` が在れば release がそれで
      # 署名される仕組みは `app/android/app/build.gradle.kts` に既にある（無ければ debug の鍵に落ちる）。
      #
      # **secret に届かない run では署名も upload もしない。** fork から来た PR には secret が渡らないので、
      # ここで落とすと外からの PR が必ず赤くなる。落とさず「署名しなかった」を持ち回り、
      # **配布物として上げるのは正しい鍵で署名できた run だけ**にする（同じ名前で別の鍵のものが並ばない）。
      - name: Put the dev signing key in place
        id: devkey
        env:
          KEYSTORE_BASE64: ${{ secrets.VIEWER_DEV_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VIEWER_DEV_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "no dev signing key in reach — the dev APK will not be signed with it, and will not be uploaded"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/viewer-dev.keystore
          # 末尾の改行は secret の入れ方で付いたり付かなかったりする。付いたまま渡すと鍵が開かない。
          password=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          umask 077
          cat > android/key.properties <<EOF
          storeFile=$PWD/android/viewer-dev.keystore
          storePassword=$password
          keyAlias=viewer-dev
          keyPassword=$password
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - run: flutter build apk --debug --flavor store
      # **`dev` だけ release で焼く。** ここで焼いたものはゲートを通るためだけのものではなく、
      # **そのままメンバーの端末へ入る配布物**（→ `app/README.md`「配って試すものを、メンバーへ渡す」）。
      # 触って判断してもらうのに JIT の debug では速さの印象が別物になる。組める範囲は狭まらない
      # ——release は AOT まで通すので、見る範囲は debug より広い側に倒れる。
      - run: flutter build apk --release --flavor dev
      - run: flutter build apk --debug --flavor local
      # 取り方は `gh run download`——**Web UI の「Download artifact」は手順に載せない**
      # （ブラウザが zip に隔離を付ける）。`path` はワークスペースからの相対で、
      # このジョブの `working-directory` は効かない。
      - uses: actions/upload-artifact@v7
        if: steps.devkey.outputs.signed == 'true'
        with:
          name: viewer-dev-apk
          path: app/build/app/outputs/flutter-apk/app-dev-release.apk
          # 既定は warn。名前が変わったときに黙って空の artifact が並ぶより、ここで落ちるほうがよい。
          if-no-files-found: error

  app-ios:
    name: app — build for iOS
    runs-on: macos-latest
    needs: [changes, versions]
    if: ${{ needs.changes.outputs.app == 'true' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.versions.outputs.flutter }}
          channel: stable
          cache: true
      - run: flutter pub get
      # 署名しない。証明書はリリースの持ち物で、組めるかどうかとは別の話。
      - run: flutter build ios --no-codesign --flavor store

  # プラグインと Worker が回すのは**手元のゲートと同じ2行だけ**。段を CI 側にだけ足すと、
  # 手元が全部緑でも push した瞬間に赤くなる形ができる。
  plugin:
    name: plugin — build and test
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.plugin == 'true' }}
    steps:
      - uses: actions/checkout@v7
      # 版は plugin/go.mod が唯一の持ち主。
      - uses: actions/setup-go@v7
        with:
          go-version-file: plugin/go.mod
      - run: make -C plugin build
      # マニフェスト検査は amenbo が PATH に在るときだけ走る（plugin/Makefile が自分で分岐する）。
      # CI に amenbo は入れない——このリポの持ち物ではないし、配布の入口で同じ規則がもう一度見る。
      - run: make -C plugin test

  worker:
    name: worker — build and test
    runs-on: ubuntu-latest
    needs: [changes, versions]
    if: ${{ needs.changes.outputs.worker == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.versions.outputs.node }}
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: make -C worker install
      # build の中の `wrangler deploy --dry-run` は組めるかを見るだけ。Worker が立つ先は利用者自身の
      # Cloudflare だから、ここに資格情報は要らないし置いていない。
      - run: make -C worker build
      - run: make -C worker test

  # 層で絞らない。見ているのはツリーの形で、どのファイルの変更でも崩れうるうえ、数秒で終わる。
  guards:
    name: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make guards

  # main が要求する唯一のチェック。**ジョブを足したら needs にも足す**——書かれていないジョブを
  # これは待たないので、その判定が無いまま緑になり、赤くなるものが何も無い。
  # guards/check-ci-aggregate.sh が2つの並びを突き合わせる（上の guards ジョブが回す）。
  #
  # `always()` で回すのは、依存が落ちたときに skip ではなく fail させるため。skip された必須チェックは
  # 赤ではないので、マージは来ない判定を待ち続けるか、与えられていない判定で入る。
  # `skipped` は通す——層で絞ったジョブが skip されるのは、動いていない層に対する普通の答え。
  # `cancelled` は落とす——そのジョブは何も判定していない。
  all-green:
    name: all green
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - changes
      - versions
      - app-check
      - app-android
      - app-ios
      - plugin
      - worker
      - guards
    steps:
      - name: Fold every job's result
        env:
          # ジョブごとに書き下さず、`needs` を丸ごとデータとして読む。needs の並びが増えても、
          # 畳む側が置いていかれない。
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "  \(.value.result)\t\(.key)"'
          failed=$(echo "$RESULTS" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key')
          if [ -n "$failed" ]; then
            echo "::error::did not pass: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "every job in this workflow passed or was skipped"
