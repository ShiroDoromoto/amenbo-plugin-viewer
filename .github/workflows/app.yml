# アプリだけで回る CI。
#
# **他の部品の完成を待たない。** amenbo 本体もプラグインも Worker も要らないところで検証が
# 終わるのが要件そのもので、ここが1つでも他を要求し始めたら、アプリはもう単独では完成して
# いない。paths を app/ に絞ってあるのも同じ理由——他の部品の変更でこれが動く必要は無い。
name: app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  # 出す直前に手で回せるようにしておく（審査の日程はこちらで決められないので、
  # 「今の main が通るか」を訊きたい場面が来る）。
  workflow_dispatch:

# PR で走っている古い実行だけ畳む。あそこは1本のブランチを何度も直す場所で、要るのは
# 先頭の判定だけ。
#
# **main では畳まない。** 複数のセッションが並行して main へ入れるので、push は短い間隔で
# 重なる。畳むと判定が付くのは最後の1つだけになり、検証は抜けないまま（main は直列なので
# 後の実行が前を含む）**自分の変更が緑かどうかを他人の実行から探すことになる**。
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 手元と CI で同じものを使う。channel だけの指定だと、ある朝 CI だけが上がって、
  # 落ちた理由がこちらの変更なのか Flutter の更新なのか読めなくなる。
  FLUTTER_VERSION: "3.44.9"

defaults:
  run:
    working-directory: app

jobs:
  # 静的解析とテスト。プラットフォームの SDK を要らないので、いちばん安い runner で回る。
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  # 2つの OS 向けに実際に組めること。ここが通らないビルドは、テストが全部緑でも出せない。
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # 署名しない。証明書はリリースの持ち物で、組めるかどうかとは別の話。
      - run: flutter build ios --no-codesign
