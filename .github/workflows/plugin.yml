# プラグインだけで回る CI。
#
# **手元のゲートと同じものを回す。** 段を CI 側だけに足すと「手元が全部緑でも push した瞬間に
# 赤くなる」が生まれる——アプリで現に起きていることなので、ここでは増やさない。回すのは
# `make -C plugin build` と `make -C plugin test` の2行だけで、中身の持ち主は plugin/Makefile。
#
# マニフェスト検査は amenbo が PATH に在るときだけ走る（plugin/Makefile が自分で分岐する）。
# CI に amenbo は入れない——それはこのリポの持ち物ではないし、配布の入口で同じ規則が
# もう一度見る。
name: plugin

on:
  push:
    branches: [main]
    paths: ["plugin/**", ".github/workflows/plugin.yml"]
  pull_request:
    paths: ["plugin/**", ".github/workflows/plugin.yml"]
  workflow_dispatch:

# PR で走っている古い実行だけ畳む。main では畳まない——複数のセッションが並行して入れるので、
# 畳むと判定が付くのは最後の1つだけになり、自分の変更が緑かどうかを他人の実行から探すことになる。
concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 版は plugin/go.mod が唯一の持ち主。ここに数字を書くと、手元と CI で違う Go が
      # 使われても誰も気づかない。
      - uses: actions/setup-go@v7
        with:
          go-version-file: plugin/go.mod
      - run: make -C plugin build
      - run: make -C plugin test
