# プラグインの配布アセットを焼く。
#
# **タグ push でしか起動しない。** merge や branch push でも走らせると、誰も版を決めて
# いないのにアセットが並び始める——版が存在するのはタグだけなので、起動条件をタグに
# 絞ることが「版を決めたのは人間だ」と言える唯一の形になる。
#
# ここが作るのは GitHub Release までで、**それは配布ではない**。利用者が入る経路は
# カタログエントリが指す url の一本なので、配布のスイッチはカタログ PR のマージ側にある。
name: Release

on:
  push:
    tags: ["v*"]

# Release を作るので書き込みが要る。それ以外は既定の read のまま。
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 版は plugin/go.mod が唯一の持ち主。ここで数字を書くと、手元と CI で違う Go が
      # 使われても誰も気づかない。
      - uses: actions/setup-go@v7
        with:
          go-version-file: plugin/go.mod

      # OS をここで数え直さない——アセットキーの一覧は plugin/Makefile の PLATFORMS が
      # 唯一の持ち主で、dist はそこから全部を焼く。dist はゲート（gofmt / vet / test /
      # マニフェスト検査）を先に回すので、タグは通らないものを配れない。
      # タグ名は探しに行かず受け取る——アセットはその名前で呼ばれ、どの版かを言って
      # いるのはこの ref だけ。
      - name: Bake every asset
        run: make -C plugin dist VERSION="$GITHUB_REF_NAME"

      # カタログエントリに書く checksum の出どころ。ログの奥ではなく run summary に
      # 出す（リリース後にまず開かれるのがここ）。
      - name: Publish the digests
        run: |
          {
            echo '## Assets for the catalog entry'
            echo
            echo '```'
            cd plugin/dist && shasum -a 256 *.tar.gz
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" plugin/dist/*.tar.gz \
            --title "$GITHUB_REF_NAME" \
            --notes "Assets for the catalog entry. Digests are in the run summary; a release becomes installable only once the catalog entry points at it."
