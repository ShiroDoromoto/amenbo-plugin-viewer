name: amenbo_viewer
description: "Read your Amenbo backlog on your phone"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.2.3+8

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Material's own words — the licence page, the date picker, the text field's menu. They are
  # drawn by widgets this app did not write, and this is the only way they come out in the same
  # language as everything around them.
  flutter_localizations:
    sdk: flutter

  # How a date and a clock are written in each of the nineteen languages — the month names, and
  # whether the day comes before the month or after it. Those are not choices a translator should
  # be asked to make key by key; they are the same in every app that language is read in.
  # `any` is what flutter_localizations asks for: it pins its own version, and a second constraint
  # here would only be a way for the two to disagree.
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  cryptography: ^2.9.0

  # Held below 11, which compiles against SDK 37 — a level the SDK manager only ships as
  # android-37.0, so Gradle looks for android-37 and finds nothing. The Android build fails
  # before it reaches any of our code. Move it up once a plain android-37 exists.
  flutter_secure_storage: ^10.3.1

  # The local copy of the backlog. This package bundles SQLite with the app rather than calling
  # whichever one the OS happens to ship, which is what makes the phone, this machine and CI agree
  # on what the database can do — FTS5 and its trigram tokeniser above all, since a word tokeniser
  # has nothing to split Japanese on.
  sqlite3: ^3.5.1

  # Where that file goes: application support, which is neither backed up nor shown as documents.
  path_provider: ^2.1.6

  # The Cloudflare route's only reason for being here is `Client`: it is the seam the intake is
  # handed, so the pages can be checked against answers written by hand rather than against a
  # socket. `dart:io` would do the fetching just as well and leave nothing to stand in for it.
  http: ^1.6.0

  # Pairing, and only pairing. The two below exist for the one screen that reads the code off
  # the PC, and neither of them is reached again afterwards.

  # The camera and the decoder.
  mobile_scanner: ^7.4.0

  # Asking for the camera, and — the part nothing else offers on both platforms — sending someone
  # to this app's own page in the system settings, which is the only way back from a refusal.
  #
  # Held below 13 for the same reason as flutter_secure_storage above: its Android half compiles
  # against SDK 37, which is not a level that exists to compile against yet.
  permission_handler: ^12.0.0

  # The way out. Nothing written here goes back to the backlog, so a thought had while reading
  # leaves through the OS share sheet or not at all — and that sheet is one of the few things
  # neither Dart nor a few lines of our own platform code can put up on both phones.
  share_plus: ^13.3.0

  # One link, and it is not optional: both stores refuse an app whose privacy policy cannot be
  # reached from inside it, and a URL somebody has to copy out and type is not reached. Handing a
  # web address to the browser is a platform call on each side, so this is the one line of it we
  # do not write twice.
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # `Words` is generated from the sheets in `lib/l10n/`, not written by hand.
  generate: true

  # The Material icon set, which is what every glyph on these screens is.
  uses-material-design: true

  # No typeface is carried, and none is to be added here. Nineteen languages are coming, and
  # their glyphs together weigh tens of megabytes — which is not a price a thing that is opened
  # for half a minute can pay. Every language is drawn in the face the phone already has.
